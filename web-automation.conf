# Configuration file for Web Automation Server

[logs]
# Log level based on numeric values of Python logging levels:
# - Critical: 50
# - Error:    40
# - Warning:  30
# - Info:     20
# - Debug:    10
# - Not set:   0
level = 20

[http]
# IP and port to listen on for HTTP requests.
listen = 127.0.0.1:8000

[recording]
# Browser to use for automation. Please note that the "chrome" value does not
# refer to the web browser, but to the Selenium WebDriver. In practice, "chrome"
# will use Google Chrome, or Chromium if Google Chrome is not installed.
# Allowed values: firefox, chrome
# Defaults to firefox
browser = firefox

# Path to the Selenium driver to use for automation.
# If set the driver must match the browser being used (for example,
# "/usr/bin/geckodriver" for "firefox"). If no driver is explicitly set Selenium
# Manager will try to find the right one in $PATH, downloading it as a fallback.
#driverPath =

# Path to the browser executable to use for automation.
# If set the executable must match the browser being used (for example,
# "/usr/bin/firefox-esr" for "firefox"). If no executable is explicitly set
# Selenium Manager will try to find the right one in $PATH.
#browserPath =

[backend]
# Default backend configuration for web automation
# Allow any hostname as backend endpoint for simplified setup
allowall = true

# Video dimensions for browser window
videowidth = 1920
videoheight = 1080

# Skip certificate verification for development
skipverify = true